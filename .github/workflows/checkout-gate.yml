name: Shepherdy Checkout Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Add these as repository secrets (sandbox values). Without them S1 cannot search the bundle and is "not proven".
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      PAYPAL_API_BASE: https://api-m.sandbox.paypal.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # S3 scans the whole git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Static checks (S1-S3) on every pull request: a BLOCKED verdict fails this job.
      - run: npm run gate:static
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: .gate/report.html
